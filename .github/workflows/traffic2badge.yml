name: Traffic2Badge

on:
  workflow_dispatch:
  schedule:
    - cron: "3 2 * * *"

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Traffic Badges
        id: traffic
        uses: yi-Xu-0100/traffic-to-badge@v1.4.0
        with:
          my_token: ${{ secrets.TRAFFIC_TOKEN }}
          static_list: ChenGan666/ZSN.AgentBrook

      - name: Debug output
        run: |
          echo "traffic_path=${{ steps.traffic.outputs.traffic_path }}"
          echo "--- file listing ---"
          find . -maxdepth 2 -name "*.svg" -o -name "*.json" | head -50

      - name: Deploy to traffic branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ${{ steps.traffic.outputs.traffic_path }}
          publish_branch: traffic
          allow_empty_commit: true
          personal_token: ${{ secrets.TRAFFIC_TOKEN }}
          commit_message: "Update traffic badges"
