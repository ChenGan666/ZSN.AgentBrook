name: Traffic2Badge

on:
  workflow_dispatch:
  schedule:
    - cron: "3 2 * * *"

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Traffic Badges
        uses: yi-Xu-0100/traffic-to-badge@v1.4.0
        with:
          my_token: ${{ secrets.TRAFFIC_TOKEN }}
          static_list: ZSN.AgentBrook

      - name: Ensure traffic directory exists
        run: mkdir -p ./traffic

      - name: Deploy to traffic branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./traffic
          publish_branch: traffic
          allow_empty_commit: true
          personal_token: ${{ secrets.TRAFFIC_TOKEN }}
          commit_message: "Update traffic badges"
