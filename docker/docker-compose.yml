
services:

  api:
    container_name: API
    build:
      context: ./API
      dockerfile: Dockerfile
    volumes:
      - shared_volume:/shared
    ports:
      - "5003:5003"
    environment:
      - MYSQL_HOST=mysql
      - POSTGRES_HOST=postgres
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    depends_on:
      - mysql
      - postgres
      - redis
      - funasr

  autojob:
    container_name: AutoJob
    build:
      context: ./AutoJob
      dockerfile: Dockerfile
    volumes:
      - shared_volume:/shared
    environment:
      - MYSQL_HOST=mysql
      - POSTGRES_HOST=postgres
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    depends_on:
      - mysql
      - postgres
      - redis
      - funasr
      - api

  manage:
    container_name: Manage
    build:
      context: ./Manage
      dockerfile: Dockerfile
    volumes:
      - shared_volume:/shared
    ports:
      - "5002:5002"
    environment:
      - MYSQL_HOST=mysql
      - POSTGRES_HOST=postgres
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    depends_on:
      - mysql
      - postgres
      - redis
      - autojob
      - api

  mcpserver:
    container_name: MCPServer
    build:
      context: ./MCPServer
      dockerfile: Dockerfile
    volumes:
      - shared_volume:/shared
    ports:
      - "5008:5008"
    environment:
      - MYSQL_HOST=mysql
      - POSTGRES_HOST=postgres
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    depends_on:
      - mysql
      - postgres
      - redis
      - autojob
      - api

  client:
    container_name: Client
    build:
      context: ./Client
      dockerfile: Dockerfile
    ports:
      - "5006:5006"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    depends_on:
      - api

  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql  # 数据持久化
      - ./mysql/conf.d:/etc/mysql/conf.d
    restart: always
    environment:
      - TZ=Asia/Shanghai

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: zsn_knowledge_base
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1q2w3e
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:5.0.10
    container_name: redis_5.0.10
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    environment:
      - TZ=Asia/Shanghai

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8800:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: always
    environment:
      - TZ=Asia/Shanghai

  funasr:
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.13
    container_name: funasr
    privileged: true
    ports:
      - "10095:10095"
    volumes:
      - ./funasr-runtime-resources/models:/workspace/models
    command:
      - bash
      - -lc
      - |
        cd /workspace/FunASR/runtime
        touch /workspace/models/hotwords.txt
        nohup bash run_server_2pass.sh \
          --download-model-dir /workspace/models \
          --vad-dir damo/speech_fsmn_vad_zh-cn-16k-common-onnx \
          --model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-onnx \
          --online-model-dir damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx \
          --punc-dir damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx \
          --itn-dir thuduj12/fst_itn_zh \
          --hotword /workspace/models/hotwords.txt \
          --certfile 0 > /workspace/models/funasr.log 2>&1 &
        tail -f /workspace/models/funasr.log
    restart: always
    environment:
      - TZ=Asia/Shanghai

volumes:
  postgres_data: {}
  mysql_data: {}
  redis_data: {}
  shared_volume: {}
